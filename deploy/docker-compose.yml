# Docker Compose configuration for Traffic Collector VM deployment
# Provides containerized deployment option for cloud platforms

version: '3.8'

services:
  traffic-collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: traffic-collector-daemon
    restart: unless-stopped
    environment:
      - TOMTOM_API_KEY=${TOMTOM_API_KEY}
      - TRAFFIC_API_KEY=${TRAFFIC_API_KEY:-change-this-api-key}
      - API_SECRET_KEY=${API_SECRET_KEY:-change-this-secret-key}
      - DB_PATH=/var/lib/traffic-collector/traffic_data.db
    volumes:
      - traffic_data:/var/lib/traffic-collector
      - traffic_logs:/var/log
      - ./config:/etc/traffic-collector:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - traffic-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  traffic-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: traffic-api
    restart: unless-stopped
    environment:
      - TRAFFIC_API_KEY=${TRAFFIC_API_KEY:-change-this-api-key}
      - API_SECRET_KEY=${API_SECRET_KEY:-change-this-secret-key}
      - DB_PATH=/var/lib/traffic-collector/traffic_data.db
    volumes:
      - traffic_data:/var/lib/traffic-collector:ro
      - traffic_logs:/var/log
    ports:
      - "8081:8080"
    depends_on:
      - traffic-collector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - traffic-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: traffic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - traffic_logs:/var/log/nginx
    depends_on:
      - traffic-api
    networks:
      - traffic-network

volumes:
  traffic_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/traffic-collector
  traffic_logs:
    driver: local

networks:
  traffic-network:
    driver: bridge